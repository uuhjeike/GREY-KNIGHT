<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>GREY KNIGHT</title>
<meta name="description" content="GREY KNIGHT — a growing identity archive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 4v9c0 8-5 13-11 15C10 28 5 23 5 15V6z' fill='%23101830' stroke='%23b99649'/%3E%3Cpath d='M16 8v16M11 13h10' stroke='%23c9d1de' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="https://raw.githubusercontent.com/uuhjeike/GREY-KNIGHT/main/file_00000000476081f68d9ae1965a7f37e6.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#feedWrap">Skip to posts</a>

<div class="shell">

  <aside class="rail" id="profile" aria-label="Profile">
    <div class="plate-wrap">
      <button class="plate" id="plateBtn" type="button" aria-label="View profile photo full size">
        <span class="plate-frame">
          <img id="plate"
               data-photo="https://github.com/uuhjeike/GREY-KNIGHT/blob/main/file_00000000476081f68d9ae1965a7f37e6.png"
               alt="A Grey Knight in worn silver and black power armour, blue-lit eyes, holding a sword wreathed in lightning before a banner reading Purify the Unclean in a gothic cathedral."
               decoding="async">
        </span>
      </button>
      <div class="thumbs" id="thumbs" hidden></div>
    </div>

    <div class="ident">
      <h1 class="name">GREY KNIGHT</h1>
      <p class="tagline" id="tagline">Purify the unclean</p>
      <p class="bio" id="bio" hidden></p>
      <dl class="stats">
        <div><dt>Records</dt><dd id="stRecords">…</dd></div>
        <div><dt>Media</dt><dd id="stMedia">…</dd></div>
        <div><dt>Synced</dt><dd id="stSync">…</dd></div>
      </dl>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <button type="button" data-nav="profile">Profile</button>
      <button type="button" data-nav="posts" aria-current="true">Posts</button>
      <button type="button" data-nav="media">Media</button>
      <button type="button" data-nav="search">Search</button>
    </nav>

    <div class="railfoot">
      <button type="button" class="linkish" id="checkBtn">Data check <i id="checkN" hidden></i></button>
    </div>
  </aside>

  <main class="main">
    <div class="bar" id="bar">
      <div class="search">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="Search ID, title, text, date, type" aria-label="Search the archive">
        <button type="button" id="qClear" aria-label="Clear search" hidden>×</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter posts">
        <button type="button" class="chip" data-f="0" aria-pressed="true">All</button>
        <button type="button" class="chip" data-f="1" aria-pressed="false">Text</button>
        <button type="button" class="chip" data-f="2" aria-pressed="false">Photo</button>
        <button type="button" class="chip" data-f="4" aria-pressed="false">Video</button>
        <button type="button" class="chip" data-f="8" aria-pressed="false">Audio</button>
        <button type="button" class="chip" data-f="16" aria-pressed="false">Files</button>
        <button type="button" class="chip" data-f="32" aria-pressed="false">YouTube</button>
        <button type="button" class="chip" data-f="64" aria-pressed="false">Shorts</button>
        <button type="button" class="chip" data-f="128" aria-pressed="false">Links</button>
      </div>
    </div>

    <div class="statusline">
      <span id="status" role="status" aria-live="polite">Loading Post.txt…</span>
      <button type="button" class="linkish" id="rev" aria-pressed="false">Reverse order</button>
    </div>

    <div id="notice"></div>

    <div id="feedWrap">
      <div id="topSpacer"></div>
      <div id="topS" class="sentinel"></div>
      <div id="rows"></div>
      <div id="botS" class="sentinel"></div>
      <p id="empty" class="empty" hidden></p>
      <div id="tail"></div>
    </div>
  </main>
</div>

<dialog id="check">
  <div id="checkBody"></div>
  <div class="dlg-actions" id="checkActions"></div>
</dialog>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <img id="vImg" alt="" draggable="false">
  <div class="v-top">
    <span id="vCount"></span>
    <span class="v-sp"></span>
    <button type="button" id="vZoomOut" aria-label="Zoom out">−</button>
    <button type="button" id="vZoomIn" aria-label="Zoom in">+</button>
    <button type="button" id="vFull" aria-label="Toggle full screen">Full</button>
    <button type="button" id="vClose" aria-label="Close viewer">×</button>
  </div>
  <button type="button" id="vPrev" class="v-nav l" aria-label="Previous image">‹</button>
  <button type="button" id="vNext" class="v-nav r" aria-label="Next image">›</button>
</div>

<noscript><p style="padding:24px;color:#c9d1de">GREY KNIGHT reads its posts from Post.txt with JavaScript. Please enable JavaScript.</p></noscript>
<script src="script.js" defer></script>
</body>
</html>
