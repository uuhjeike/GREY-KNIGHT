<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GREY KNIGHTS</title>
<meta name="description" content="GREY KNIGHTS: Ordo Malleus, Daemon Hunters. A continuously expanding digital archive.">
<meta name="theme-color" content="#04060b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2304060b'/%3E%3Cpath d='M32 6l20 8v16c0 14-9 24-20 28C21 54 12 44 12 30V14z' fill='none' stroke='%23cfd7e0' stroke-width='3'/%3E%3Cpath d='M32 18v26M24 26h16' stroke='%2366ccff' stroke-width='3'/%3E%3C/svg%3E">
<script>
/* Permanent-link fast path: runs before anything else is parsed or painted.
   If the URL has ?post=ID, switch to the dedicated post view and start fetching Post.txt immediately. */
(function(){var d=document.documentElement,id=new URLSearchParams(location.search).get('post')||(/[#&]post=([^&]+)/.exec(location.hash)||[])[1];
if(id&&id.trim()){d.classList.add('gk-solo');
try{window.__gkText=fetch('Post.txt',{cache:'no-cache'}).then(function(r){return r.ok?r.text():null}).catch(function(){return null})}catch(e){}}})();
</script>
<style>
/* critical rules for the dedicated post view: self-contained so a cached style.css can never blank the page */
html{background:#04060b}
html.gk-solo section.solo{display:block}
html.gk-solo .side,html.gk-solo .sect,html.gk-solo #notice,html.gk-solo #feed,html.gk-solo #state{display:none!important}
html.gk-solo .shell{display:block;max-width:800px;padding-top:16px}
html.gk-solo .main{max-width:760px;margin:0 auto}
</style>
<script>
/* if anything in the post view fails, never leave a blank page */
window.addEventListener('error',function(e){var d=document.documentElement;if(!d.classList.contains('gk-solo'))return;var b=document.getElementById('soloBody');if(b&&b.querySelector('.solo-load'))b.innerHTML='<p style="padding:28px 8px;text-align:center;color:#cfd7e0">Something went wrong loading this transmission. <a style="color:#66ccff" href="">Try again</a>.</p>'});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Cinzel:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<a class="skip" href="#feed">Skip to transmissions</a>

<!-- atmosphere: cathedral skyline, psychic storm, drifting embers (decorative only) -->
<div class="bg" id="bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="bolt"></div>
  <div class="far"></div>
  <div class="candle"></div>
  <div class="near"></div>
  <div class="vig"></div>
</div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<div class="shell">
  <aside class="side">
    <header class="plate" id="profile">
      <button class="avatar" id="avatar" type="button" aria-label="View profile photo" hidden>
        <span class="aura"></span>
        <span class="runes"></span>
        <span class="ring"><img id="avatarImg" alt="GREY KNIGHTS profile photo" decoding="async"></span>
        <i class="rv t"></i><i class="rv l"></i><i class="rv r"></i><i class="rv b"></i>
        <span class="badge"><svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 5l6 2.3v5c0 3.6-2.6 6-6 7.2-3.4-1.2-6-3.6-6-7.2v-5z" fill="none" stroke="#f1d6d6" stroke-width="1.2"/><path d="M12 8.5v7M9.5 11h5" stroke="#f1d6d6" stroke-width="1.2"/></svg></span>
      </button>
      <div class="ident">
        <h1 class="name"><a href="./" id="home">GREY KNIGHTS</a></h1>
        <p class="rank">Ordo Malleus</p>
        <p class="order">Daemon Hunters</p>
        <p class="status"><i class="dot" id="dot"></i><span id="statusText">Connecting</span></p>
      </div>
      <div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 2l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M12 7v10M8.5 10.5h7" stroke="currentColor" stroke-width="1.2"/></svg></div>
      <dl class="stats">
        <div><dt>Transmissions</dt><dd id="nPosts">–</dd></div>
        <div><dt>Media</dt><dd id="nMedia">–</dd></div>
      </dl>
      <button id="share" class="btn share" type="button">Share profile</button>
    </header>

    <section class="console" id="console" aria-label="Search and filters">
      <div class="row">
        <input id="q" type="search" placeholder="Search transmissions" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search transmissions">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type">
        <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-f="text" aria-pressed="false">Text</button>
        <button class="chip" type="button" data-f="photo" aria-pressed="false">Photo</button>
        <button class="chip" type="button" data-f="video" aria-pressed="false">Video</button>
        <button class="chip" type="button" data-f="audio" aria-pressed="false">Audio</button>
        <button class="chip" type="button" data-f="files" aria-pressed="false">Files</button>
        <button class="chip" type="button" data-f="youtube" aria-pressed="false">YouTube</button>
        <button class="chip" type="button" data-f="shorts" aria-pressed="false">Shorts</button>
        <button class="chip" type="button" data-f="links" aria-pressed="false">Links</button>
      </div>
      <p class="result" id="result" hidden aria-live="polite"></p>
    </section>
  </aside>

  <main class="main">
    <section id="solo" class="solo" aria-label="Transmission">
      <div id="soloBody" class="solo-body"><div class="solo-load" role="status" aria-label="Loading transmission"></div></div>
    </section>
    <h2 class="sect"><span>Transmissions</span></h2>
    <div id="notice" class="notice" hidden role="status">
      <span id="noticeText"></span>
      <button type="button" class="btn" id="noticeBtn">Show latest</button>
    </div>
    <div id="feed" class="feed"><div id="top" class="spacer"></div><div id="tail" class="tail"></div></div>
    <div id="state" class="state" role="status"></div>
  </main>
</div>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="v-bar">
    <span id="vcount" class="v-count"></span>
    <div class="v-tools">
      <button type="button" data-v="out" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      <button type="button" data-v="in" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      <button type="button" data-v="fs" id="vfs" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      <button type="button" data-v="close" id="vclose" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
    </div>
  </div>
  <div class="v-stage" id="vstage"><img id="vimg" alt="" draggable="false"></div>
  <button type="button" class="v-nav prev" data-v="prev" aria-label="Previous image"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  <button type="button" class="v-nav next" data-v="next" aria-label="Next image"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#cfd7e0">GREY KNIGHTS needs JavaScript to read Post.txt.</p></noscript>
<script src="script.js?v=8" defer></script>
</body>
</html>
